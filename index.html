<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Francho · Seguimiento</title>

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800;1,900&family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: una columna de móvil con pestañas fijas abajo; hojas que suben desde abajo para el detalle */
:root{
  --bg:#F4F2EC; --surface:#FFFFFF; --line:#E2DED4; --soft:#EEEAE0; --chip:#E7E3D8;
  --ink:#16181D; --muted:#5C6170; --accent:#E8590C; --accent-ink:#C2410C; --accent-soft:#FDE7D8;
  --dark:#16181D; --on-dark:#FFFFFF; --on-dark-muted:#C9CCD3;
  --good:#1F6F43; --good-soft:#DCEFE3; --warn:#B7791F; --warn-soft:#FBEED3; --bad:#B42318; --bad-soft:#FDECEC;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'DM Sans',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1B1E23; --line:#2C3038; --soft:#252931; --chip:#2A2E36;
  --ink:#F1EFEA; --muted:#A3A8B4; --accent:#F07A33; --accent-ink:#F7A06A; --accent-soft:#3A2418;
  --dark:#0B0C0E; --on-dark:#FFFFFF; --on-dark-muted:#A9AEB8;
  --good:#5BC28A; --good-soft:#173324; --warn:#E3A84A; --warn-soft:#352914; --bad:#F27466; --bad-soft:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1B1E23; --line:#2C3038; --soft:#252931; --chip:#2A2E36;
  --ink:#F1EFEA; --muted:#A3A8B4; --accent:#F07A33; --accent-ink:#F7A06A; --accent-soft:#3A2418;
  --dark:#0B0C0E; --on-dark:#FFFFFF; --on-dark-muted:#A9AEB8;
  --good:#5BC28A; --good-soft:#173324; --warn:#E3A84A; --warn-soft:#352914; --bad:#F27466; --bad-soft:#3A1A17; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:14px 16px 150px;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05;margin:0}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px} .grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.dark{background:var(--dark);border-color:var(--dark);color:var(--on-dark)}
.card.dark .muted{color:var(--on-dark-muted)}
.card.hot{border:2px solid var(--accent)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card.dark .eyebrow{color:#FDBA74}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:500;font-size:14px;line-height:1.1;padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark);font-weight:700}
.seg small{display:block;font-size:11px;font-weight:400;opacity:.75}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:46px;padding:0 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.ghost-dark{background:transparent;border-color:#4B505C;color:var(--on-dark)}
.btn.block{width:100%}
.btn.ghost-dark[aria-pressed="true"],.card.dark .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--chip);font-size:12.5px;border:0}
.chip.ok{background:var(--good-soft);color:var(--good)} .chip.link{background:transparent;border:1px solid var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none}
.chip.method{background:var(--dark);color:var(--on-dark);font-weight:700}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:10px 4px}
.ring{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:0}
.ring svg{width:72px;height:72px}
.agenda{display:flex;flex-direction:column}
.agenda button{display:flex;gap:12px;align-items:center;padding:9px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.agenda .t{width:44px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.agenda .done .txt{color:var(--muted);text-decoration:line-through}
.agenda .now .txt{color:var(--accent-ink);font-weight:700}
.tick{color:var(--good);font-weight:700}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--soft)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.delta{font-size:11.5px;font-weight:700;text-align:right;white-space:nowrap}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tools .btn{font-size:13px;padding:0 6px;line-height:1.15}
.delta.plus{color:var(--good)} .delta.minus{color:var(--bad)}
.list > *{border-top:1px solid var(--soft);padding:8px 0}
.list > *:first-child{border-top:0}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:center;gap:4px}
.macros .num{font-size:20px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs svg{width:22px;height:22px}
.timer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--dark);color:var(--on-dark);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer .num{font-size:30px;line-height:1}
.timer.go{background:var(--good)}
.sheet-wrap{position:fixed;inset:0;background:rgba(10,12,16,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:10px 16px calc(140px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line)}
.sets{display:flex;flex-direction:column}
.set{display:grid;grid-template-columns:24px minmax(0,1fr) auto 44px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--soft)}
.set input{width:58px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center;font-weight:700;font-size:16px}
.set .ok{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.set.isdone .ok{background:var(--good);border-color:var(--good);color:#fff}
.linea{border:0;background:none;padding:0;text-align:left;color:inherit;display:block;width:100%}
.list > .linea.row,.list .linea.row{display:flex;gap:10px;align-items:center}
.ex{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;width:100%;padding:0}
.ex img{width:52px;height:60px;object-fit:contain;border-radius:8px;background:#fff;flex-shrink:0}
.bigimg{position:relative;width:118px;height:138px;flex-shrink:0;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.bigimg img{width:100%;height:100%;object-fit:contain}
.bigimg img.mus{position:absolute;right:4px;bottom:4px;width:42px;height:46px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#fff}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-size:16px;color:var(--ink)}
.field textarea{height:72px;padding:10px 12px}
.field{min-width:0}.field input,.field select,.field textarea{width:100%;min-width:0}
.banner{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35);background:var(--dark);color:var(--on-dark);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60}
a{color:var(--accent-ink)}

/* ===== Estilo SPORT (por defecto). El clásico es todo lo de arriba. ===== */
html[data-estilo="sport"]{
  --bg:#000000; --surface:#1C1C1E; --line:#2C2C2E; --soft:#2C2C2E; --chip:#2C2C2E;
  --ink:#FFFFFF; --muted:#9A9AA0; --accent:#A6FF00; --accent-ink:#A6FF00; --accent-soft:rgba(166,255,0,.14);
  --dark:#1C1C1E; --on-dark:#FFFFFF; --on-dark-muted:#9A9AA0;
  --good:#A6FF00; --good-soft:rgba(166,255,0,.16); --warn:#FFD60A; --warn-soft:rgba(255,214,10,.16); --bad:#FA114F; --bad-soft:rgba(250,17,79,.18);
  --r-pasos:#FA114F; --r-prot:#A6FF00; --r-hab:#1EEAEF;
  --body:'Inter',system-ui,-apple-system,sans-serif; color-scheme:dark;
}
html[data-estilo="sport"] body{background:#000}
html[data-estilo="sport"] h1,html[data-estilo="sport"] h2{font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.2px}
html[data-estilo="sport"] h1{font-size:32px;line-height:.95}
html[data-estilo="sport"] h2{font-size:23px;line-height:1}
html[data-estilo="sport"] h3{font-weight:700}
html[data-estilo="sport"] .num{font-weight:800}
html[data-estilo="sport"] .eyebrow{font-weight:800;letter-spacing:.1em;color:var(--muted)}
html[data-estilo="sport"] .card{border:0;border-radius:18px}
html[data-estilo="sport"] .card.dark{background:#1C1C1E;box-shadow:inset 3px 0 0 #A6FF00}
html[data-estilo="sport"] .card.dark .eyebrow{color:#A6FF00}
html[data-estilo="sport"] .card.hot{border:2px solid #A6FF00}
html[data-estilo="sport"] .seg{background:#1C1C1E}
html[data-estilo="sport"] .seg button{font-weight:700;text-transform:uppercase;font-size:12.5px;letter-spacing:.03em}
html[data-estilo="sport"] .seg small{text-transform:none;letter-spacing:0}
html[data-estilo="sport"] .seg button[aria-pressed="true"]{background:#A6FF00;color:#000}
html[data-estilo="sport"] .card.dark .seg button[aria-pressed="true"],html[data-estilo="sport"] .btn.ghost-dark[aria-pressed="true"]{background:#A6FF00;border-color:#A6FF00;color:#000}
html[data-estilo="sport"] .btn{border:0;background:#2C2C2E;border-radius:999px;font-weight:700}
html[data-estilo="sport"] .btn.primary{background:#A6FF00;color:#000;font-weight:800;letter-spacing:.02em}
html[data-estilo="sport"] .btn.ghost-dark{background:rgba(255,255,255,.12);border:0}
html[data-estilo="sport"] .chip{background:#2C2C2E;font-weight:600}
html[data-estilo="sport"] .chip.ok{background:var(--good-soft);color:#A6FF00}
html[data-estilo="sport"] .chip.method{background:#FA114F;color:#fff}
html[data-estilo="sport"] .chip.link{border-color:#A6FF00;color:#A6FF00}
html[data-estilo="sport"] .rings{background:#1C1C1E}
html[data-estilo="sport"] .ring .trk{stroke:currentColor;opacity:.22}
html[data-estilo="sport"] .ring svg{width:76px;height:76px}
html[data-estilo="sport"] .agenda{background:#1C1C1E;border-radius:18px;padding:0 14px}
html[data-estilo="sport"] .agenda button{border-bottom-color:#2C2C2E}
html[data-estilo="sport"] .agenda button:last-child{border-bottom:0}
html[data-estilo="sport"] .agenda .now .txt{color:#A6FF00}
html[data-estilo="sport"] .tick{width:22px;height:22px;border-radius:50%;background:#A6FF00;color:#000;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0}
html[data-estilo="sport"] .stepper button{border:0;background:#2C2C2E}
html[data-estilo="sport"] nav.tabs{background:#0D0D0D;border-top-color:#1C1C1E}
html[data-estilo="sport"] nav.tabs button{text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.04em;color:#8E8E93}
html[data-estilo="sport"] nav.tabs button[aria-current="page"]{color:#A6FF00}
html[data-estilo="sport"] .timer{background:#1C1C1E;border-top:2px solid #A6FF00}
html[data-estilo="sport"] .timer .num{color:#A6FF00;font-size:34px}
html[data-estilo="sport"] .timer.go{background:#A6FF00;color:#000}
html[data-estilo="sport"] .timer.go .num{color:#000}
html[data-estilo="sport"] .sheet{background:#0B0B0C}
html[data-estilo="sport"] .grab{background:#3A3A3C}
html[data-estilo="sport"] .set{border-top-color:#2C2C2E}
html[data-estilo="sport"] .set input{background:#2C2C2E;border:0;color:#fff;font-family:var(--display);font-size:19px;font-weight:800}
html[data-estilo="sport"] .set .ok{background:transparent;border:2px solid #3A3A3C}
html[data-estilo="sport"] .set.isdone .ok{background:#A6FF00;border-color:#A6FF00;color:#000}
html[data-estilo="sport"] .bigimg{border:0}
html[data-estilo="sport"] .ex img,html[data-estilo="sport"] .bigimg{border-radius:12px}
html[data-estilo="sport"] .field input,html[data-estilo="sport"] .field select,html[data-estilo="sport"] .field textarea{background:#2C2C2E;border:0;color:#fff}
html[data-estilo="sport"] .banner{color:#fff}
html[data-estilo="sport"] .sheet-wrap{background:rgba(0,0,0,.78)}
html[data-estilo="sport"] .sheet{border-top:1px solid #2C2C2E}
html[data-estilo="sport"] .toast{background:#1C1C1E;color:#fff;border:1px solid #A6FF00;font-weight:700}
html[data-estilo="sport"] main > .row.between h1{font-size:28px}
html[data-estilo="sport"] a{color:#A6FF00}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</head>
<body>
<div class="app">
  <main id="main"></main>
  <div id="timer" class="timer" hidden></div>
  <nav class="tabs" aria-label="Secciones">
    <button data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
    <button data-tab="entreno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Entreno</button>
    <button data-tab="comida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 3v3"/></svg>Comida</button>
    <button data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9"/></svg>Progreso</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6"/></svg>Plan</button>
  </nav>
  <div id="sheet"></div>
  <input type="file" id="foto" accept="image/*" hidden>
</div>
<script>
window.__errs=[];
window.addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='SCRIPT'){window.__errs.push('No carga '+(t.src||'').split('/').pop());}else{window.__errs.push((e.message||'error')+' @ '+String(e.filename||'').split('/').pop()+':'+(e.lineno||''));}},true);
setTimeout(function(){var m=document.getElementById('main');if(m&&!m.innerHTML.trim()){m.innerHTML='<div style="padding:16px;font:14px/1.4 sans-serif"><b>La app no ha arrancado.</b> Haz captura de esto y mándasela a Claude:<pre style="white-space:pre-wrap;font-size:12px">'+(window.__errs.join('\n')||'sin errores')+'\nPLAN:'+typeof window.PLAN+' supabase:'+typeof window.supabase+'\n'+navigator.userAgent+'</pre></div>';}},3000);
</script>
